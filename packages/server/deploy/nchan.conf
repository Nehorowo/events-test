# nginx + nchan configuration matching the contract the client speaks.
#
# The Node server ships with an in-process broker that mimics this, so the demo
# runs with `npm run dev` alone. To put the real thing in front of it:
#
#   1. run nginx with this config (nchan module built in);
#   2. start the API with NCHAN_PUBLISH_URL=http://localhost:8080/pub/live_events
#      so every message is mirrored into the channel;
#   3. start the client with VITE_SSE_URL=http://localhost:8080/live_events.
#
# Nothing in the browser code changes: same `id:`/`event:`/`data:` framing, same
# `Last-Event-ID` resume, same replay-then-live behaviour.

worker_processes 1;
events { worker_connections 1024; }

http {
  # The channel keeps ~10 minutes of history. This is the window a client can
  # resume across, and the reason `/events` may be 10 minutes stale without the
  # page ever showing a hole: the two windows are sized to overlap.
  server {
    listen 8080;

    # --- subscriber endpoint -------------------------------------------
    location /live_events {
      nchan_subscriber eventsource;
      nchan_channel_id live_events;

      # A subscriber without a cursor gets the whole retained buffer, which is
      # what lets a page that subscribes before fetching cover the snapshot's
      # staleness.
      nchan_subscriber_first_message oldest;

      # Browsers cannot set headers on `EventSource`, so accept the cursor as a
      # query argument as well as the standard `Last-Event-ID` header.
      nchan_last_message_id $arg_last_event_id $http_last_event_id $arg_last_event_id;

      # Keeps intermediaries from buffering the stream.
      nchan_eventsource_ping_interval 15;
      add_header X-Accel-Buffering no;
    }

    # --- publisher endpoint (internal) ---------------------------------
    location /pub/live_events {
      nchan_publisher http;
      nchan_channel_id live_events;

      # Retention: whichever limit is hit first.
      nchan_message_buffer_length 5000;
      nchan_message_timeout 10m;

      # Only the API may publish.
      allow 127.0.0.1;
      deny all;
    }

    # The publisher sets X-EventSource-Event, which nchan turns into the SSE
    # `event:` field. The message type is also duplicated inside the JSON body
    # for consumers that only parse `data:`.
  }
}
